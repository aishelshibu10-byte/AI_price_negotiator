
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Price Negotiator - Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .price { font-size: 1.2em; color: #2c3e50; font-weight: bold; }
        .btn { display: inline-block; margin-top: 10px; padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Product Catalog</h1>
    <div class="grid">
        {% for product in products %}
        <div class="card">
            <h3>{{ product.name }}</h3>
            <p><strong>Brand:</strong> {{ product.brand }} | <strong>Category:</strong> {{ product.category }}</p>
            <p class="price">₹{{ product.original_price }}</p>
            <p><strong>Stock:</strong> {{ product.stock }}</p>
            <a href="{% url 'product_detail' product.id %}" class="btn">Make an Offer</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
