<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - AI Price Negotiator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .price { font-size: 1.5em; color: #2c3e50; font-weight: bold; margin: 15px 0; }
        .offer-box { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
        input[type="number"] { padding: 10px; width: 60%; font-size: 1em; }
        button { padding: 10px 20px; font-size: 1em; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'product_list' %}">&larr; Back to Products</a>
        <h1>{{ product.name }}</h1>
        <p><strong>Brand:</strong> {{ product.brand }} | <strong>Category:</strong> {{ product.category }}</p>
        <p class="price">Original Price: ₹{{ product.original_price }}</p>
        <p><strong>Stock Remaining:</strong> {{ product.stock }}</p>

        <div class="offer-box">
            <h3>Make an Offer</h3>
            <form method="POST">
                {% csrf_token %}
                <input type="number" name="offer_price" placeholder="Enter your offer price (₹)" required>
                <button type="submit">Submit Offer</button>
            </form>
        </div>
    </div>
</body>
</html>
