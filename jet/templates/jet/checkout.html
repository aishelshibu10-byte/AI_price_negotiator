<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - AI Price Negotiator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .total { text-align: right; font-size: 1.3em; font-weight: bold; margin-top: 20px; }
        button, a { display: inline-block; padding: 10px 15px; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; }
        button { background: #28a745; color: white; }
        a { background: #6c757d; color: white; }
        .actions { display: flex; justify-content: space-between; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        {% for item in items %}
            <div class="row">
                <span>{{ item.product.name }} x {{ item.quantity }}</span>
                <strong>₹{{ item.subtotal }}</strong>
            </div>
        {% endfor %}
        <p class="total">Total: ₹{{ total }}</p>
        <form method="POST">
            {% csrf_token %}
            <div class="actions">
                <a href="{% url 'cart_view' %}">Back to Cart</a>
                <button type="submit">Place Order</button>
            </div>
        </form>
    </div>
</body>
</html>
